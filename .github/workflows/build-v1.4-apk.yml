name: Build Max Delta v1.4 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-v1.4-apk.yml"
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: max-delta-v1.4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Record APK metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/release/apk-info.txt
          sha256sum "$apk" > app/build/outputs/apk/release/unsigned-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-delta-v1.4-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/apk-info.txt
            app/build/outputs/apk/release/unsigned-sha256.txt
          if-no-files-found: error
          retention-days: 7
